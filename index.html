<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
:root, :root[data-theme="light"], :root[data-theme="dark"]{
  --paper:#F6F8F5; --mist:#E9EFEA; --sage:#D6E5DC;
  --ink:#14302C; --sea:#1F6B6A; --sun:#F3B93E; --muted:#4F6661;
  --display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --wrap:1120px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.6}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:4px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 1.5rem}

/* Header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(246,248,245,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--mist)}
.bar{display:flex;align-items:center;justify-content:space-between;height:68px;gap:1rem}
.logo{font-family:var(--display);font-weight:800;font-size:1.25rem;text-decoration:none;letter-spacing:-.01em}
nav ul{display:flex;gap:1.75rem;list-style:none}
nav a{text-decoration:none;font-weight:500;font-size:.95rem;color:var(--muted)}
nav a:hover{color:var(--ink)}
.lang{display:flex;gap:.25rem;background:var(--mist);padding:.25rem;border-radius:999px}
.lang button{border:0;background:transparent;font:600 .8rem var(--body);color:var(--muted);padding:.35rem .7rem;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* Hero */
.hero{padding:5rem 0 6rem}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:3.5rem;align-items:center}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(2.8rem,6.5vw,5.4rem);line-height:.98;letter-spacing:-.035em;max-width:11ch}
.hero p{margin-top:1.75rem;font-size:1.2rem;color:var(--muted);max-width:34ch}
.actions{display:flex;flex-wrap:wrap;gap:.9rem;margin-top:2.25rem}
.btn{display:inline-block;text-decoration:none;font-weight:600;padding:.95rem 1.5rem;border-radius:999px;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn-main{background:var(--ink);color:var(--paper)}
.btn-ghost{border:1.5px solid var(--ink)}
.portrait{position:relative;aspect-ratio:4/5;max-width:420px;justify-self:end;width:100%}
.portrait::before{content:"";position:absolute;width:62%;aspect-ratio:1;border-radius:50%;background:var(--sun);right:-8%;top:-7%;z-index:0}
.arch{position:relative;z-index:1;width:100%;height:100%;border-radius:220px 220px 18px 18px;overflow:hidden}

/* Photo placeholders: replace with <img> */
.ph{width:100%;height:100%;background:repeating-linear-gradient(135deg,var(--sage) 0 14px,#CBDDD2 14px 28px);display:grid;place-items:center;color:var(--sea);font-weight:600;font-size:.9rem;text-align:center;padding:1rem}

/* Sections */
section{padding:6rem 0}
h2{font-family:var(--display);font-weight:800;font-size:clamp(2rem,4vw,3.1rem);line-height:1.05;letter-spacing:-.025em;max-width:18ch}
.lead{margin-top:1rem;color:var(--muted);max-width:52ch}

/* Story timeline */
#storia{background:var(--ink);color:var(--paper)}
#storia .lead{color:#B9CCC6}
.story{display:grid;grid-template-columns:.8fr 1.2fr;gap:4rem;margin-top:3.5rem;align-items:start}
.story .photo{aspect-ratio:3/4;border-radius:18px;overflow:hidden}
.story .ph{background:repeating-linear-gradient(135deg,#1C4540 0 14px,#214D47 14px 28px);color:#9CC3BA}
.steps{list-style:none;position:relative}
.steps::before{content:"";position:absolute;left:7px;top:10px;bottom:10px;width:2px;background:#2E5751}
.steps li{position:relative;padding:0 0 2.5rem 2.75rem}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:"";position:absolute;left:0;top:.45rem;width:16px;height:16px;border-radius:50%;background:var(--ink);border:2px solid var(--sun)}
.steps li:last-child::before{background:var(--sun)}
.steps h3{font-family:var(--display);font-weight:600;font-size:1.4rem;letter-spacing:-.01em}
.steps p{color:#C6D6D1;margin-top:.35rem;max-width:46ch}

/* Services */
.services{margin-top:3rem;border-top:1.5px solid var(--ink)}
.service{display:grid;grid-template-columns:1fr 1.3fr;gap:2rem;padding:2rem 0;border-bottom:1px solid var(--sage);align-items:baseline}
.service h3{font-family:var(--display);font-weight:600;font-size:clamp(1.4rem,2.6vw,1.9rem);letter-spacing:-.015em}
.service p{color:var(--muted);max-width:48ch}
.tag{display:inline-block;margin-left:.6rem;vertical-align:middle;font:600 .75rem var(--body);background:var(--sun);color:var(--ink);padding:.2rem .6rem;border-radius:999px}

/* Why */
#perche{background:var(--mist)}
.why{display:grid;grid-template-columns:repeat(2,1fr);gap:2.5rem 4rem;margin-top:3rem}
.why h3{font-family:var(--display);font-weight:600;font-size:1.35rem;margin-bottom:.4rem}
.why p{color:var(--muted);max-width:42ch}

/* Contact */
#contatti{background:var(--sea);color:var(--paper);text-align:left}
#contatti .lead{color:#D2E6E2}
.links{display:flex;flex-wrap:wrap;gap:.9rem;margin-top:2.5rem}
#contatti .btn-main{background:var(--sun);color:var(--ink)}
#contatti .btn-ghost{border-color:var(--paper)}
footer{background:var(--ink);color:#9FB7B1;font-size:.9rem;padding:1.75rem 0}

@media (max-width:860px){
  nav ul{display:none}
  .hero{padding:3rem 0 4rem}
  .hero .wrap,.story{grid-template-columns:1fr;gap:3rem}
  .portrait{justify-self:start;max-width:340px}
  .service{grid-template-columns:1fr;gap:.5rem}
  .why{grid-template-columns:1fr}
  section{padding:4.5rem 0}
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#F6F8F5;--ink:#14302C}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn{transition:none}}
</style>
