<link rel="canonical" href="https://moresilab.com/">

<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
:root, :root[data-theme="light"], :root[data-theme="dark"]{
  --paper:#F8FAF6; --sage-50:#EEF3EB; --sage-100:#DCE7D7; --sage-200:#B7CCB0;
  --leaf:#8DAA86; --leaf-d:#5E7D5A; --forest:#2F4632; --ink:#26332A; --muted:#5D6B60;
  --name:"Playfair Display", Georgia, "Times New Roman", serif;
  --title:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --body:"Source Serif 4", Georgia, serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#F8FAF6;--ink:#26332A}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:1.075rem;line-height:1.65}
a{color:inherit}
:focus-visible{outline:3px solid var(--leaf);outline-offset:3px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding:0 1.5rem}

/* Type hierarchy: name / title / subtitle */
.label{font-family:var(--title);font-weight:600;font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--leaf-d)}
h2{font-family:var(--title);font-weight:700;font-size:clamp(1.9rem,3.8vw,2.8rem);line-height:1.08;letter-spacing:-.02em;margin-top:.6rem;max-width:20ch}
.sub{font-family:var(--name);font-style:italic;font-weight:400;font-size:1.15rem;color:var(--muted);margin-top:.7rem;max-width:48ch}

/* Header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(248,250,246,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--sage-100)}
.bar{display:flex;align-items:center;justify-content:space-between;height:68px;gap:1rem}
.logo{font-family:var(--name);font-weight:600;font-size:1.35rem;text-decoration:none;display:flex;align-items:baseline;gap:.45rem}
.logo span{font-family:var(--title);font-weight:600;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--paper);background:var(--leaf-d);padding:.25rem .5rem .2rem;border-radius:4px;transform:translateY(-.15rem)}
nav ul{display:flex;gap:1.75rem;list-style:none}
nav a{font-family:var(--title);font-weight:500;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:var(--muted)}
nav a:hover{color:var(--ink)}
.lang{display:flex;gap:.25rem;background:var(--sage-50);padding:.25rem;border-radius:999px}
.lang button{border:0;background:transparent;font:600 .75rem var(--title);letter-spacing:.06em;color:var(--muted);padding:.35rem .7rem;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--forest);color:var(--paper)}

/* Hero */
.hero{padding:5rem 0 6rem}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:3.5rem;align-items:center}
.hero h1{font-family:var(--name);font-weight:700;font-size:clamp(3rem,6.6vw,5.4rem);line-height:1;letter-spacing:-.015em}
.hero h1 em{font-style:italic;color:var(--leaf-d)}
.hero .label{margin-top:1.4rem;display:block}
.hero .sub{font-size:1.3rem;color:var(--ink);margin-top:.9rem}
.hero .intro{margin-top:1.2rem;color:var(--muted);max-width:44ch}
.actions{display:flex;flex-wrap:wrap;gap:.9rem;margin-top:2.2rem}
.btn{display:inline-block;text-decoration:none;font-family:var(--title);font-weight:600;font-size:.92rem;letter-spacing:.02em;padding:.95rem 1.5rem;border-radius:999px;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn-main{background:var(--forest);color:var(--paper)}
.btn-ghost{border:1.5px solid var(--forest)}
.portrait{position:relative;aspect-ratio:4/5;max-width:420px;justify-self:end;width:100%}
.portrait::before{content:"";position:absolute;width:62%;aspect-ratio:1;border-radius:50%;background:var(--sage-200);right:-8%;top:-7%}
.arch{position:relative;z-index:1;width:100%;height:100%;border-radius:220px 220px 18px 18px;overflow:hidden}
.ph{width:100%;height:100%;background:repeating-linear-gradient(135deg,var(--sage-100) 0 14px,#D1DFCB 14px 28px);display:grid;place-items:center;color:var(--leaf-d);font:600 .85rem var(--title);text-align:center;padding:1rem}

section{padding:6rem 0}

/* Story */
#storia{background:var(--forest);color:var(--paper)}
#storia .label{color:var(--sage-200)}
#storia .sub{color:#C9D8C4}
.story{display:grid;grid-template-columns:.8fr 1.2fr;gap:4rem;margin-top:3rem;align-items:start}
.story .photo{aspect-ratio:3/4;border-radius:18px;overflow:hidden}
.story .ph{background:repeating-linear-gradient(135deg,#3A5540 0 14px,#405C46 14px 28px);color:var(--sage-200)}
.story .text p{color:#DCE6D8;margin-bottom:1.2rem;max-width:56ch}
.story blockquote{font-family:var(--name);font-style:italic;font-size:1.6rem;line-height:1.3;color:var(--paper);border-left:2px solid var(--leaf);padding-left:1.2rem;margin-top:2rem}

/* Services */
.services{margin-top:3rem;border-top:1.5px solid var(--forest)}
.service{display:grid;grid-template-columns:1fr 1.25fr;gap:2rem;padding:2rem 0;border-bottom:1px solid var(--sage-100);align-items:baseline}
.service h3{font-family:var(--title);font-weight:600;font-size:clamp(1.3rem,2.3vw,1.65rem);letter-spacing:-.01em;line-height:1.2}
.service p{color:var(--muted);max-width:50ch}
.service.main h3{color:var(--leaf-d)}
.tag{display:inline-block;margin-top:.5rem;font:600 .7rem var(--title);letter-spacing:.1em;text-transform:uppercase;background:var(--sage-100);color:var(--forest);padding:.3rem .7rem;border-radius:999px}

/* Career */
#percorso{background:var(--sage-50)}
.career{list-style:none;margin-top:3rem;border-top:1.5px solid var(--forest)}
.career li{display:grid;grid-template-columns:9rem 1fr 1.2fr;gap:1.5rem 2rem;padding:1.6rem 0;border-bottom:1px solid var(--sage-100)}
.years{font-family:var(--title);font-weight:600;font-size:.8rem;letter-spacing:.1em;color:var(--leaf-d);padding-top:.25rem}
.role{font-family:var(--title);font-weight:600;font-size:1.15rem;line-height:1.3}
.org{font-style:italic;color:var(--muted);font-size:1rem}
.career p{color:var(--muted)}
.edu{margin-top:3.5rem}
.edu ul{list-style:none;margin-top:1rem;display:grid;grid-template-columns:repeat(2,1fr);gap:1rem 3rem}
.edu li{border-left:2px solid var(--leaf);padding-left:1rem}
.edu strong{font-family:var(--title);font-weight:600;display:block}
.edu span{font-style:italic;color:var(--muted);font-size:.98rem}

/* Why */
.why{display:grid;grid-template-columns:repeat(2,1fr);gap:2.5rem 4rem;margin-top:3rem}
.why h3{font-family:var(--title);font-weight:600;font-size:1.25rem;margin-bottom:.4rem}
.why p{color:var(--muted);max-width:44ch}

/* Contact */
#contatti{background:var(--leaf-d);color:var(--paper)}
#contatti .label{color:var(--sage-100)}
#contatti .sub{color:#E3ECDF}
.links{display:flex;flex-wrap:wrap;gap:.9rem;margin-top:2.5rem}
#contatti .btn-main{background:var(--paper);color:var(--forest)}
#contatti .btn-ghost{border-color:var(--paper)}
footer{background:var(--forest);color:var(--sage-200);font:500 .8rem var(--title);letter-spacing:.06em;padding:1.75rem 0}

@media (max-width:860px){
  nav ul{display:none}
  .hero{padding:3rem 0 4rem}
  .hero .wrap,.story{grid-template-columns:1fr;gap:3rem}
  .portrait{justify-self:start;max-width:320px;margin-left:10%}
  .service{grid-template-columns:1fr;gap:.5rem}
  .career li{grid-template-columns:1fr;gap:.3rem}
  .why,.edu ul{grid-template-columns:1fr}
  section{padding:4.5rem 0}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn{transition:none}}
</style>
